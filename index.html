<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

</head>
<body>
    <header class="cabeçalho">
        <div class="cabeçalho-início">
            <i class="fa-solid fa-bars"></i>
            <div class="logotipo">
                <i class="fa-brands fa-youtube logotipo-ícone"></i>
                <p class="logotipo-nome">YouTube</p>
                <p class="logotipo-país">BR</p>


            </div>

        </div>
        <div class="cabeçalho-centro">
            <div class="search">
                <input type="text" name="search" id="search-input" class="search-input" placeholder="Pesquisar...">
                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <button class="microfone">
                <i class="fa-solid fa-microphone"></i>
            </button>
            
        </div>
        <div class="cabeçalho-final">
            <button class="logotipo-video" title="Criar">
                <i class="fa-solid fa-video"></i>
            </button>
            <button class="logotipo-video" title="Notificaçõe">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button class="logotipo-video" title="Sua conta">L</button>
        </div>
    </header>

    <main class="principal">
        <div class="principal-sidebar">
            <div class="sidebar-inicio">
                <a>
                    <i class="fa-solid fa-house"></i>
                    <span>Início</span>
                </a>
                <a>
                    <i class="fa-solid fa-clapperboard"></i>
                    <span>Shorts</span>
                </a>
                <a>
                    <i class="fa-solid fa-square-rss"></i>
                    <span>Insrições</span>
                </a>
            </div>
            <div class="sidebar-centro">
                <span class="sidebar-titulo">Você</span>
                <a>
                    <i class="fa-solid fa-user"></i>
                    <span>Seu canal</span>
                </a>
                <a>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Histórico</span>
                </a>
                <a>
                    <i class="fa-solid fa-list"></i>
                    <span>Playlists</span>
                </a>
                <a>
                    <i class="fa-solid fa-video"></i>
                    <span>Seus vídeos</span>
                </a>
                <a>
                    <i class="fa-solid fa-clock"></i>
                    <span>Assistir mais tarde</span>
                </a>
                <a>
                    <i class="fa-solid fa-thumbs-up"></i>
                    <span>Vídeos curtidos</span>
                </a>
            </div>
            <div class="sidebar-final"></div>
        </div>
        <div class="principal-video">
            a
        </div>
        <div class="principal-recomendados">
            a
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
